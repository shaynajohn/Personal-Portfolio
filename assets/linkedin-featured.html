<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn Featured Thumbnail — Shayna John</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #e8e0e4;
        font-family: "DM Sans", system-ui, sans-serif;
      }

      .instructions {
        position: fixed;
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
        background: #121012;
        color: #fff;
        font-size: 0.8rem;
        padding: 0.6rem 1rem;
        border-radius: 8px;
        z-index: 10;
      }

      /* LinkedIn featured / OG size */
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #fffbfc;
        overflow: hidden;
        color: #121012;
      }

      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
      }

      .blob--1 {
        width: 420px;
        height: 420px;
        background: radial-gradient(circle, rgba(255, 185, 205, 0.55) 0%, transparent 70%);
        top: -80px;
        left: -60px;
      }

      .blob--2 {
        width: 360px;
        height: 360px;
        background: radial-gradient(circle, rgba(255, 210, 225, 0.45) 0%, transparent 70%);
        bottom: -40px;
        right: 80px;
      }

      .blob--3 {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(255, 195, 215, 0.4) 0%, transparent 68%);
        top: 180px;
        right: 200px;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(196, 91, 122, 0.07) 1px, transparent 1px);
        background-size: 24px 24px;
      }

      .content {
        position: relative;
        z-index: 1;
        height: 100%;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .eyebrow {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #c45b7a;
        margin-bottom: 20px;
        display: inline-block;
        padding: 8px 16px;
        border-radius: 999px;
        border: 1px solid rgba(196, 91, 122, 0.25);
        background: rgba(255, 255, 255, 0.55);
        width: fit-content;
      }

      h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 72px;
        font-weight: 400;
        line-height: 1.08;
        letter-spacing: -0.02em;
        margin-bottom: 24px;
        max-width: 700px;
      }

      .glyphs {
        color: #c45b7a;
        letter-spacing: 0.12em;
      }

      .stats {
        display: flex;
        gap: 10px;
        margin-bottom: 36px;
      }

      .stats span {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8a8286;
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid #f0e0e8;
        background: rgba(255, 255, 255, 0.65);
      }

      .console {
        max-width: 520px;
        padding: 2px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(196, 91, 122, 0.4), rgba(255, 200, 215, 0.25), rgba(196, 91, 122, 0.35));
        box-shadow: 0 8px 40px rgba(196, 91, 122, 0.15);
      }

      .console-inner {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 22px;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 14px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
      }

      .prompt {
        color: #c45b7a;
        font-weight: 600;
        font-size: 18px;
      }

      .query {
        color: #8a8286;
        font-size: 17px;
        font-family: "DM Sans", sans-serif;
      }

      .status {
        margin-left: auto;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8a8286;
      }

      .url {
        position: absolute;
        bottom: 48px;
        right: 80px;
        font-size: 14px;
        font-weight: 600;
        color: #b84d6f;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <p class="instructions">
      Screenshot the card below (1200×630) — hide this bar first, or print to PDF
    </p>

    <div class="card" id="thumbnail">
      <div class="blob blob--1"></div>
      <div class="blob blob--2"></div>
      <div class="blob blob--3"></div>
      <div class="grid"></div>

      <div class="content">
        <p class="eyebrow">Applied ML Engineer · RAG &amp; Data Systems</p>
        <h1>
          Hey, I'm Shayna.<br />
          I love <span class="glyphs">∘⋆․⊹․∘</span> all things data.
        </h1>
        <div class="stats">
          <span>RAG &amp; Retrieval</span>
          <span>Data Pipelines</span>
          <span>ML Systems</span>
        </div>
        <div class="console">
          <div class="console-inner">
            <span class="prompt">query &gt;</span>
            <span class="query">rag pipelines · hudl · tempo…</span>
            <span class="status">ready</span>
          </div>
        </div>
      </div>

      <p class="url">portfolio →</p>
    </div>
  </body>
</html>
